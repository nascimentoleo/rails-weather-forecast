---
openapi: 3.0.1
info:
  title: Weather Forecast API
  version: v1
paths:
  "/api/v1/addresses":
    get:
      summary: Searches US addresses that have a zip code
      tags:
      - Addresses
      parameters:
      - name: full_address
        in: query
        required: true
        description: Address to search for
        example: 1180 Seven Seas Dr
        schema:
          type: string
      responses:
        '200':
          description: matching addresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  addresses:
                    type: array
                    items:
                      "$ref": "#/components/schemas/address"
                required:
                - addresses
        '400':
          description: invalid full address
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '502':
          description: address lookup service failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/forecast":
    get:
      summary: Returns the current temperature and the daily forecast for the zip
        code of a US address
      tags:
      - Forecast
      parameters:
      - name: full_address
        in: query
        required: true
        description: US address to look up
        example: 1180 Seven Seas Dr
        schema:
          type: string
      - name: units
        in: query
        required: false
        schema:
          type: string
          enum:
          - fahrenheit
          - celsius
          default: celsius
      - name: days
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 16
          default: 7
      responses:
        '200':
          description: the address and its forecast
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/forecast"
        '400':
          description: invalid parameters
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: no address with a zip code was found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '502':
          description: address lookup or weather service failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
servers:
- url: "/"
components:
  schemas:
    address:
      type: object
      properties:
        full_address:
          type: string
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip:
          type: string
        latitude:
          type: number
        longitude:
          type: number
      required:
      - full_address
      - city
      - state
      - zip
      - latitude
      - longitude
    forecast:
      type: object
      properties:
        from_cache:
          type: boolean
        address:
          type: object
          properties:
            full_address:
              type: string
            zip:
              type: string
            latitude:
              type: number
            longitude:
              type: number
          required:
          - full_address
          - zip
          - latitude
          - longitude
        forecast:
          type: object
          properties:
            units:
              type: string
              enum:
              - fahrenheit
              - celsius
            current_temperature:
              type: number
            daily_temperatures:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  high:
                    type: number
                  low:
                    type: number
                required:
                - date
                - high
                - low
          required:
          - units
          - current_temperature
          - daily_temperatures
      required:
      - from_cache
      - address
      - forecast
    error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
